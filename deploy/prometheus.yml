global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rekaserdoba-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: rekaserdoba
    metrics_path: /healthz
    static_configs:
      - targets:
          - 127.0.0.1:9080

  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100

  - job_name: public_https
    metrics_path: /probe
    params:
      module:
        - https_2xx
    static_configs:
      - targets:
          - https://messk.online/
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
