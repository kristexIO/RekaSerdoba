groups:
  - name: rekaserdoba
    rules:
      - alert: RekaSerdobaDown
        expr: absent(rekaserdoba_up) or rekaserdoba_up != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: RekaSerdoba edge is unavailable
      - alert: RekaSerdobaNetworkNotReady
        expr: rekaserdoba_network_ready != 1 or rekaserdoba_h3_ready != 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: RekaSerdoba carrier or network helper is not ready
      - alert: RekaSerdobaPacketDrops
        expr: rate(rekaserdoba_network_dropped_packets_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: RekaSerdoba drops packets
      - alert: RekaSerdobaHandshakeFailures
        expr: rate(rekaserdoba_handshake_failed_total[10m]) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RekaSerdoba has sustained authenticated handshake failures
      - alert: RekaSerdobaOverloaded
        expr: increase(rekaserdoba_overloaded_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: RekaSerdoba rejected carriers because the concurrency limit was reached
      - alert: RekaSerdobaDisconnectErrors
        expr: increase(rekaserdoba_disconnects_error_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: RekaSerdoba recorded unexpected disconnects
      - alert: RekaSerdobaPublicProbeFailed
        expr: probe_success{job="public_https"} != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: RekaSerdoba public HTTPS endpoint is unavailable
      - alert: RekaSerdobaCertificateExpiresSoon
        expr: probe_ssl_earliest_cert_expiry{job="public_https"} - time() < 604800
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: RekaSerdoba TLS certificate expires within seven days
      - alert: RekaSerdobaDiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RekaSerdoba root filesystem has less than fifteen percent free
      - alert: RekaSerdobaMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RekaSerdoba host has less than ten percent memory available
      - alert: RekaSerdobaBackupStale
        expr: time() - rekaserdoba_backup_latest_timestamp_seconds > 604800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: RekaSerdoba has no verified backup from the last seven days
