name: Production Smoke

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  availability:
    name: Public endpoint and TLS
    runs-on: ubuntu-latest
    steps:
      - name: HTTPS availability
        run: curl --fail --silent --show-error --max-time 10 --retry 2 --retry-all-errors https://messk.online/ >/dev/null
      - name: TLS validity
        run: echo | openssl s_client -connect messk.online:443 -servername messk.online 2>/dev/null | openssl x509 -checkend 604800 -noout
