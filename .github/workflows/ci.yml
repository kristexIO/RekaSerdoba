name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust protocol
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rekaserdoba
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rekaserdoba
      - run: cargo fmt --check
      - run: cargo test --locked

  protocol-tools:
    name: Protocol tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rekaserdoba/tools/requirements.txt
      - run: python -m pip install -r rekaserdoba/tools/requirements.txt
      - run: python -m unittest discover -s rekaserdoba/tools -p "test_*.py"
        env:
          PYTHONPATH: ${{ github.workspace }}/rekaserdoba/tools

  windows-client:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography==49.0.0 h2==4.3.0
      - run: python -m unittest -v windows-client\test_client.py
        env:
          PYTHONPATH: ${{ github.workspace }}\windows-client;${{ github.workspace }}
