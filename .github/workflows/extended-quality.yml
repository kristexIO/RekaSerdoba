name: Extended Quality

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rekaserdoba
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --locked --lib --summary-only --fail-under-lines 70

  fuzz:
    name: Record parser fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cd rekaserdoba/fuzz && cargo fuzz run record_frames -- -max_total_time=30 -rss_limit_mb=2048

  benchmark:
    name: Protocol benchmark
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rekaserdoba
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: rekaserdoba
      - run: cargo bench --locked --bench protocol -- --noplot --sample-size 50
