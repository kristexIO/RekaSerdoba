[package]
name = "rekaserdoba-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.10.1"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2.0"
hkdf = "0.12.4"
hmac = "0.12.1"
h3 = "0.0.8"
h3-datagram = "0.0.2"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
http = "1.3.1"
quinn = "0.11.11"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tun-rs = { version = "2.8.7", features = ["async"] }
wtransport = "0.7.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
caps = "0.5.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
